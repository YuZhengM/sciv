package:
  name: sciv
  version: 0.0.1

source:
  path: .

build:
  number: 0
  noarch: python
  script: |
    python -m pip install --no-deps fa2-modified==0.4
    python -m pip install --no-deps yzm_file==0.0.3 yzm_log==0.0.2
    python -m pip install --no-deps --ignore-installed -vv .

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools
  run:
    - python >=3.10
    - numpy >=2.0,<2.3
    - pandas >=2.2
    - scipy >=1.14
    - anndata >=0.11
    - colormap
    - easydev
    - matplotlib >=3.9.3
    - matplotlib-venn
    - seaborn
    - scanpy >=1.11
    - scikit-learn >=1.5
    - networkx >=3.3
    - palettable
    - h5py >=3.11,<3.16
    - hdf5plugin
    - mudata
    - pycomplexheatmap
    - statannotations
    - magic-impute
    - leidenalg
    - scvi-tools
    - harmonypy
    - gseapy
    - pysam
    - forceatlas2-python
    - louvain
    - snapatac2
    - numba
    - pynndescent
    - psutil
    - zarr <3

test:
  imports:
    - sciv

about:
  summary: "Unveiling the pivotal cell types involved in variant function regulation at a single-cell resolution"
  license: MIT
  license_file: LICENSE
  home: https://github.com/YuZhengM/sciv
  authors:
    - name: Zheng-Min Yu
      email: yuzmbio@163.com
  description: |
    SCIV (Single-Cell Interpretation of Variants) is a tool for analyzing and visualizing
    the role of genetic variants in single-cell data, particularly focusing on regulatory
    effects across different cell types.
    
    Key features:
    - Single-cell data processing and preprocessing
    - Variant effect analysis
    - Visualization tools for variant-cell type relationships
    - Integration with popular single-cell analysis packages
    
    This package is designed to help researchers understand how genetic variants
    influence cellular phenotypes at single-cell resolution.
