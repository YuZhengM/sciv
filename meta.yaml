package:
  name: sciv
  version: 0.0.1

source:
  path: .

build:
  number: 0
  script: python -m pip install --no-deps --ignore-installed .

requirements:
  build:
    - python >=3.10
    - pip
  run:
    - python >=3.10
    - numpy ==2.2.6
    - pandas >=2.2.0
    - matplotlib ==3.9.2
    - matplotlib-venn ==1.1.2
    - seaborn ==0.13.2
    - scipy ==1.15.3
    - scanpy ==1.11.5
    - scikit-learn ==1.5.2
    - networkx ==3.3
    - palettable ==3.3.3
    - colormap ==1.0.4
    - easydev ==0.13.2
    - h5py ==3.16.0
    - hdf5plugin ==6.0.0
    - mudata ==0.3.2
    - pycomplexheatmap ==1.6.1
    - statannotations ==0.7.2
    - magic-impute ==3.0.0
    - leidenalg ==0.10.2
    - scvi-tools ==1.3.3
    - yzm_file ==0.0.3
    - yzm_log ==0.0.2
    - harmonypy ==0.0.10
    - gseapy ==1.1.9
    - pysam >=0.22.1
    - anndata ==0.11.0
    - forceatlas2-python ==1.1
    - louvain ==0.8.2
    - snapatac2 ==2.9.0
    - numba ==0.62.0
    - pynndescent ==0.5.13
    - fa2-modified ==0.4
    - psutil ==7.2.1

test:
  imports:
    - sciv

about:
  summary: "Unveiling the pivotal cell types involved in variant function regulation at a single-cell resolution"
  license: MIT
  license_file: LICENSE
  home: https://github.com/YuZhengM/sciv
  authors:
    - name: Zheng-Min Yu
      email: yuzmbio@163.com
  description: |
    SCIV (Single-Cell Interpretation of Variants) is a tool for analyzing and visualizing
    the role of genetic variants in single-cell data, particularly focusing on regulatory
    effects across different cell types.
    
    Key features:
    - Single-cell data processing and preprocessing
    - Variant effect analysis
    - Visualization tools for variant-cell type relationships
    - Integration with popular single-cell analysis packages
    
    This package is designed to help researchers understand how genetic variants
    influence cellular phenotypes at single-cell resolution.
