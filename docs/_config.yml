# Jekyll configuration

# Site settings
permalink: /:title/
title: SCIV Documentation
description: Single-Cell Integrated Variational analysis tool
author: SCIV Team

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# Exclude files from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - .gitignore
  - .git
  - vendor

# Navigation
nav:
  - title: Home
    url: /
  - title: Usage
    url: /sciv_usage/
  - title: API Reference
    url: /sciv_usage/#2-api-reference
  - title: GitHub
    url: https://github.com/YuZhengM/sciv
    external: true

# Theme settings
remote_theme: pmarsceill/just-the-docs
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache

# Just the Docs theme settings
search_enabled: true
aux_links:
  "SCIV on GitHub":
    - "https://github.com/YuZhengM/sciv"

back_to_top: true
back_to_top_text: "Back to top"

# Color scheme
color_scheme: sciv

# Footer content
footer_content: "&copy; 2025 SCIV Team. All rights reserved."

# Google Analytics
#ga_tracking: UA-XXXXXXXXX-X